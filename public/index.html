<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Pareie dispositivos para transferir arquivos diretamente.">
    <title>PassaAí — Mandou, passou.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=3">
  </head>
  <body>
    <main class="app-shell">
      <header class="brand">
        <img class="brand-logo" src="/logo.png" alt="PassaAí">
        <p>Mandou, passou.</p>
      </header>

      <section id="home-view" class="card">
        <span class="eyebrow">Transferência direta</span>
        <h1>Conecte seus dispositivos</h1>
        <p class="intro">Crie uma sala ou entre com um código para começar.</p>

        <div class="actions">
          <button id="create-room" class="button button-primary" type="button">Criar sala</button>
          <button id="show-join" class="button button-secondary" type="button">Entrar com código</button>
        </div>

        <form id="join-form" class="join-form hidden">
          <label for="room-code">Código da sala</label>
          <div class="join-row">
            <input id="room-code" name="room" type="text" inputmode="numeric"
              pattern="[0-9]{4}" maxlength="4" placeholder="0000"
              autocomplete="off" required>
            <button class="button button-primary" type="submit">Entrar</button>
          </div>
        </form>

        <p id="home-notice" class="notice hidden" role="alert"></p>
      </section>

      <section id="room-view" class="card hidden" aria-live="polite">
        <div class="room-header">
          <div>
            <span class="eyebrow">Código da sala</span>
            <h1 id="room-code-display" class="room-code">----</h1>
          </div>
          <span id="connection-status" class="status status-waiting">
            Aguardando outro dispositivo...
          </span>
        </div>
        <p id="connection-type" class="connection-type hidden"></p>

        <div id="invite-area" class="invite-area">
          <p>Compartilhe o código ou escaneie o QR Code para entrar nesta sala.</p>
          <img id="qr-code" class="qr-code" alt="QR Code para entrar na sala">
        </div>

        <section id="transfer-area" class="transfer-area hidden" aria-labelledby="transfer-title">
          <h2 id="transfer-title">Enviar arquivos</h2>
          <label id="drop-zone" class="drop-zone" for="file-input">
            <span>Enviar arquivo</span>
            <small>Escolha um arquivo ou arraste-o para esta área</small>
            <input id="file-input" type="file" hidden>
          </label>
          <div id="file-history" class="file-history" aria-live="polite"></div>
        </section>

        <p id="room-notice" class="notice hidden" role="alert"></p>
        <button id="leave-room" class="button button-link" type="button">Voltar</button>
      </section>
    </main>
    <script type="module" src="/app.js?v=6"></script>
  </body>
</html>
